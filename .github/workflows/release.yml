name: "リリース"
run-name: "v${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例：1.2.3）"
        required: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  publish:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: "バージョン解析"
        uses: tai-kun/gha-semver-parser@514211b08d1c083a5346942f3fa437f8435d1518 # v1.0.2
        with:
          version: ${{ github.event.inputs.version }}
        id: semver

      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "パッケージ一覧を取得"
        id: workspaces
        run: |
          PACKAGES=$(jq -r '.workspaces[]' package.json)
          echo "packages<<EOF" >> $GITHUB_OUTPUT
          echo "$PACKAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "パッケージ一覧"
        run: echo "$PACKAGES"
        env:
          PACKAGES: ${{ steps.workspaces.outputs.packages }}

      - name: "公開対象パッケージを決定"
        id: targets
        run: |
          TARGETS=()

          for pkg in $PACKAGES; do
            if [ ! -f "$pkg/package.json" ]; then
              continue
            fi

            NAME=$(jq -r .name "$pkg/package.json")
            PRIVATE=$(jq -r .private "$pkg/package.json")

            if [ "$PRIVATE" = "true" ]; then
              echo "非公開パッケージをスキップ: $NAME"
              continue
            fi

            if npm view "$NAME@$_VERSION" version >/dev/null 2>&1; then
              echo "既存のバージョンをスキップ: $NAME@$_VERSION"
              continue
            fi

            TARGETS+=("$pkg")
          done

          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "エラー: 公開対象のパッケージが存在しません。" >&2
            exit 1
          fi

          echo "targets<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "${TARGETS[@]}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          PACKAGES: ${{ steps.workspaces.outputs.packages }}
          _VERSION: ${{ steps.semver.outputs.version }}

      - name: "公開対象パッケージ"
        run: echo "$TARGETS"
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}

      - name: "pnpm をインストール"
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - name: "Node.js をセットアップ"
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: "依存関係をインストール"
        run: pnpm i

      - name: "ビルド"
        run: npm run build --workspaces

      - name: "バージョンを更新"
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for pkg in $PACKAGES; do
            jq --arg ver "$_VERSION" '.version = $ver' "$pkg/package.json" > tmp.json && mv tmp.json "$pkg/package.json"
          done
        env:
          PACKAGES: ${{ steps.workspaces.outputs.packages }}
          _VERSION: ${{ steps.semver.outputs.version }}

      - name: "内部依存のバージョンを統一"
        run: |
          # workspace 内パッケージ名一覧を JSON 配列で構築
          NAMES_JSON=$(mktemp)

          echo "[" > "$NAMES_JSON"
          first=1

          for pkg in $PACKAGES; do
            NAME=$(jq -r .name "$pkg/package.json")

            if [ "$first" -eq 1 ]; then
              first=0
            else
              echo "," >> "$NAMES_JSON"
            fi

            printf '"%s"' "$NAME" >> "$NAMES_JSON"
          done

          echo "]" >> "$NAMES_JSON"

          echo "workspace packages:"
          cat "$NAMES_JSON"

          # 各パッケージの依存を書き換え
          for pkg in $PACKAGES; do
            echo "$pkg の依存関係を編集"

            jq --arg version "$_VERSION" --slurpfile names "$NAMES_JSON" '
              def is_internal($names):
                ($names[0] | index(.)) != null;

              def fixdeps($names):
                with_entries(
                  if (.key as $k | ($names[0] | index($k)) != null)
                  then .value = $version
                  else .
                  end
                );

              if has("dependencies") then .dependencies |= fixdeps($names) else . end
              | if has("devDependencies") then .devDependencies |= fixdeps($names) else . end
              | if has("peerDependencies") then .peerDependencies |= fixdeps($names) else . end
              | if has("optionalDependencies") then .optionalDependencies |= fixdeps($names) else . end
            ' "$pkg/package.json" > "$pkg/package.json.tmp"

            mv "$pkg/package.json.tmp" "$pkg/package.json"
          done
        env:
          PACKAGES: ${{ steps.workspaces.outputs.packages }}
          _VERSION: ${{ steps.semver.outputs.version }}

      - name: "package.json"
        run: |
          for pkg in $PACKAGES; do
            echo "$pkg/package.json"
            cat "$pkg/package.json"
            echo
          done
        env:
          PACKAGES: ${{ steps.workspaces.outputs.packages }}

      - name: "タグ打ち"
        id: create_tag
        run: |
          TAG_NAME="v$_VERSION"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
        env:
          _VERSION: ${{ steps.semver.outputs.version }}

      - name: "Release の作成"
        run: gh release create "$_TAG_NAME" --generate-notes
        env:
          _TAG_NAME: ${{ steps.create_tag.outputs.tag_name }}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: "公開"
        run: |
          for target in $TARGETS; do
            NAME=$(jq -r .name "$target/package.json")
            echo "$NAME を公開..."
            pnpm publish "$target" --access public --no-git-checks
            sleep 10
          done
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}

      - name: "リリース失敗時のクリーンアップ"
        if: failure()
        run: |
          if [ -z "$_TAG_NAME" ]; then
            echo "タグが作成されていないため、クリーンアップをスキップします。"
            exit 0
          fi

          echo "エラーが発生しました。タグ $_TAG_NAME および関連するリリースを削除します。"

          # Release の削除
          if gh release view "$_TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$_TAG_NAME" --yes
          fi

          # リモートタグの削除
          git push --delete origin "$_TAG_NAME" || echo "リモートタグの削除に失敗しました"

          # ローカルタグの削除
          git tag -d "$_TAG_NAME" || true
        env:
          _TAG_NAME: ${{ steps.create_tag.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "pnpm ログをアップロード"
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pnpm-logs-publish
          path: /home/runner/.pnpm-debug.log
          if-no-files-found: ignore
          retention-days: 3
